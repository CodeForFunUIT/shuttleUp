name: Web CI

on:
  push:
    branches: [ main ]
    paths:
      - 'shuttleup-web/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'shuttleup-web/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./shuttleup-web

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - run: npm ci
    - run: npm run lint
    - run: npm run build
