name: Mobile CI

on:
  push:
    branches: [ main ]
    paths:
      - 'shuttleup-mobile/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'shuttleup-mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./shuttleup-mobile

    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0' # Update if necessary
        channel: 'stable'
    - run: flutter pub get
    - run: flutter analyze
    - run: flutter test
